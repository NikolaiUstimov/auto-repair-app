<section class="repair-list">
  <h2 class="repair-list__title">Мои записи</h2>
  <form
    class="repair-list__form"
    [formGroup]="repairForm"
    (ngSubmit)="addNewRepair()"
    (keyup.enter)="addNewRepair()"
  >
    <app-field formControlName="nameRepair" id="1" label="Тип работ" />
    <app-field formControlName="auto" id="2" label="Авто" />
    <app-field formControlName="licenseNumber" id="3" label="Госномер" />
    <app-field formControlName="price" id="4" type="number" label="Стоимость" />
    <app-button
      type="submit"
      variant="primary"
      size="medium"
      [disabled]="repairForm.invalid"
      (action)="addNewRepair()"
    >
      Создать запись
    </app-button>
  </form>
  <ul class="repair-list__box">
    @if (statisticRepair.dataRepair().length !== 0 ) {
      <app-card [repairList]="statisticRepair.dataRepair()" />
    } @else {
      <div>Записей пока нет!</div>
    }
  </ul>
</section>
