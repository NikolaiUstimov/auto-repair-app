@for (repair of repairList; track repair.id) {
  <li class="card" [routerLink]="['/repair', repair.id]">
    <p>{{repair.nameRepair}}</p>
    <p>{{repair.auto}}</p>
    <p>{{repair.licenseNumber}}</p>
    <p>{{repair.price | currency: 'RUB' : 'symbol' : '1.1-1'}}</p>
    <p>{{repair.createdAt}}</p>
<!--    <button class="card__crud" title="Изменить">-->
<!--      <svg icon="settings"></svg>-->
<!--    </button>-->
    <button class="card__crud" title="Удалить" (click)="deleteRepair.emit(repair.id)">
      <svg icon="trash"></svg>
    </button>
  </li>
}
