<div class="field">
  <label
    [for]="id()"
    class="field__label"
  >
    {{label()}}
  </label>
  @if (type() === 'textarea') {
    <textarea
      class="field__input field__textarea"
      [id]="id()"
      [value]="value()"
      (input)="handleInput($event)"
    ></textarea>
  } @else {
    <input
      class="field__input"
      [id]="id()"
      [type]="type()"
      [value]="value()"
      (input)="handleInput($event)"
    />
  }
</div>
